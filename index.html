<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive Unreal Engine 5 learning hub for Games Development students." />
  <title>UE5 Learning Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/" aria-label="UE5 Learning Hub home">
        <span class="brand-mark">U</span>
        <span>
          <strong>UE5</strong>
          <small>Learning Hub</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="#/" data-nav="home"><span>⌂</span> Dashboard</a>
        <a href="#/path/foundations" data-nav="foundations"><span>◫</span> Foundations</a>
        <a href="#/path/blueprints" data-nav="blueprints"><span>◇</span> Blueprints</a>
        <a href="#/path/gameplay" data-nav="gameplay"><span>⚙</span> Gameplay</a>
        <a href="#/path/practice" data-nav="practice"><span>✓</span> Good Practice</a>
        <a href="#/challenges" data-nav="challenges"><span>🔥</span> Challenges</a>
        <a href="#/homework" data-nav="homework"><span>⌂</span> Homework</a>
        <a href="#/glossary" data-nav="glossary"><span>?</span> Glossary</a>
      </nav>

      <div class="sidebar-progress">
        <div class="sidebar-level">
          <span id="sidebarLevel">LEVEL 1</span>
          <strong id="sidebarXp">0 XP</strong>
        </div>
        <div class="progress-track compact">
          <div class="progress-fill" id="sidebarProgress"></div>
        </div>
        <small id="sidebarNextLevel">500 XP to Level 2</small>
      </div>

      <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">×</button>
    </aside>

    <div class="page-shell">
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="Open menu">☰</button>

        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="globalSearch" type="search" placeholder="Search lessons, nodes, skills..." autocomplete="off" />
          <kbd>/</kbd>
          <div class="search-results" id="searchResults" hidden></div>
        </div>

        <div class="top-stats">
          <span class="streak-pill" title="Lessons completed">✓ <strong id="topCompleted">0</strong></span>
          <span class="xp-pill">XP <strong id="topXp">0</strong></span>
        </div>
      </header>

      <main id="app" tabindex="-1">
        <noscript>This learning hub needs JavaScript enabled.</noscript>
      </main>

      <footer class="footer">
        <span>UE5 Learning Hub • built for classroom use</span>
        <button class="text-button danger" id="resetProgress">Reset local progress</button>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>
