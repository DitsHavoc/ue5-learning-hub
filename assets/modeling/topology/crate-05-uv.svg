<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Crate step 5 UV</title><desc id="desc"></desc>
<defs><style>
.bg{fill:#0b1118} .mesh{fill:#111a24;stroke:#9fb4c8;stroke-width:3} .edge{fill:none;stroke:#8298ad;stroke-width:2}
.support{fill:none;stroke:#4fa8ff;stroke-width:5} .shape{fill:none;stroke:#7ce3c4;stroke-width:5} .warn{fill:none;stroke:#ff708d;stroke-width:4;stroke-dasharray:10 8}
.pivot{fill:#ffcf5a;stroke:#0b1118;stroke-width:3} .label{fill:#eaf3ff;font:700 30px Arial,sans-serif} .small{fill:#a8bacd;font:22px Arial,sans-serif}
.call{fill:#d9e8f6;font:700 22px Arial,sans-serif} .line{stroke:#d9e8f6;stroke-width:2} .uv{fill:#172536;stroke:#5f7c98;stroke-width:2}
</style><pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#d7dde5"/><rect width="20" height="20" fill="#6f7b88"/><rect x="20" y="20" width="20" height="20" fill="#6f7b88"/></pattern></defs>
<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">CRATE • STEP 5</text><text class="small" x="55" y="95">UVs: equal checker size beats pretty-looking islands.</text><rect x="90" y="170" width="420" height="420" fill="url(#checker)" stroke="#eaf3ff" stroke-width="3"/><rect x="625" y="180" width="340" height="220" class="uv"/><rect x="625" y="430" width="160" height="110" class="uv"/><rect x="805" y="430" width="160" height="110" class="uv"/><line class="line" x1="510" y1="380" x2="535" y2="380"/><circle cx="510" cy="380" r="7" fill="#eaf3ff"/><text class="call" x="547" y="387">Checker stays square</text><line class="line" x1="965" y1="290" x2="1000" y2="290"/><circle cx="965" cy="290" r="7" fill="#eaf3ff"/><text class="call" x="1012" y="297">Match shell density</text><text class="small" x="55" y="665">Fix stretching before packing. Grain, labels and scratches belong in texture — not extra polygons.</text></svg>