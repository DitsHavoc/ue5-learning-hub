</style><pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#d7dde5"/><rect width="20" height="20" fill="#6f7b88"/><rect x="20" y="20" width="20" height="20" fill="#6f7b88"/></pattern></defs>
<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">SCI-FI PANEL • STEP 6</text><text class="small" x="55" y="95">Final topology read: density follows hierarchy.</text><rect x="220" y="150" width="720" height="450" class="mesh"/><rect x="285" y="220" width="310" height="315" class="support"/><rect x="320" y="255" width="240" height="245" class="edge"/><rect x="640" y="230" width="220" height="125" class="shape"/><rect x="700" y="410" width="105" height="85" class="edge"/><rect x="650" y="520" width="26" height="16" class="edge"/><rect x="695" y="520" width="26" height="16" class="edge"/><rect x="740" y="520" width="26" height="16" class="edge"/><rect x="785" y="520" width="26" height="16" class="edge"/><rect x="830" y="520" width="26" height="16" class="edge"/><line class="line" x1="285" y1="220" x2="60" y2="180"/><circle cx="285" cy="220" r="7" fill="#eaf3ff"/><text class="call" x="72" y="187">Most edges serve big/medium forms</text><line class="line" x1="740" y1="528" x2="900" y2="545"/><circle cx="740" cy="528" r="7" fill="#eaf3ff"/><text class="call" x="912" y="552">Tiny repeat detail stays restrained</text><text class="small" x="55" y="665">Zoom out. Small detail can disappear; it should never control the whole mesh.</text></svg>