<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">SCI-FI PANEL • STEP 5</text><text class="small" x="55" y="95">Chamfer the hard edges that need a light-catching break.</text><rect x="220" y="150" width="720" height="450" class="mesh"/><rect x="228" y="158" width="704" height="434" class="support"/><rect x="285" y="220" width="310" height="315" class="support"/><rect x="640" y="230" width="220" height="125" class="edge"/><rect x="700" y="410" width="105" height="85" class="edge"/><line class="line" x1="932" y1="158" x2="930" y2="120"/><circle cx="932" cy="158" r="7" fill="#eaf3ff"/><text class="call" x="942" y="127">Outer module silhouette</text><line class="line" x1="595" y1="535" x2="835" y2="565"/><circle cx="595" cy="535" r="7" fill="#eaf3ff"/><text class="call" x="847" y="572">Primary recess border</text><text class="small" x="55" y="665">Preserve broad flat surfaces. Chamfer is for readable highlights, not to melt the whole panel.</text></svg>