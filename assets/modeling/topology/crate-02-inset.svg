<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">CRATE • STEP 2</text><text class="small" x="55" y="95">Inset makes the large front panel without cutting the whole mesh.</text><path class="mesh" d="M260,220 L780,220 L780,520 L260,520 Z"/><path class="edge" d="M260,220 L380,130 L900,130 L780,220"/><path class="edge" d="M780,220 L900,130 L900,430 L780,520"/><rect x="330" y="285" width="380" height="170" class="support"/><line class="line" x1="330" y1="285" x2="90" y2="185"/><circle cx="330" cy="285" r="7" fill="#eaf3ff"/><text class="call" x="102" y="192">Inset border • 5 cm</text><line class="line" x1="520" y1="370" x2="870" y2="325"/><circle cx="520" cy="370" r="7" fill="#eaf3ff"/><text class="call" x="882" y="332">Centre face extrudes inward • -3 cm</text><text class="small" x="55" y="665">Blue edges exist because the panel needs a real depth change. Do not add decorative loops yet.</text></svg>