<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Crate step 3 support loops</title><desc id="desc"></desc>
<defs><style>
.bg{fill:#0b1118} .mesh{fill:#111a24;stroke:#9fb4c8;stroke-width:3} .edge{fill:none;stroke:#8298ad;stroke-width:2}
.support{fill:none;stroke:#4fa8ff;stroke-width:5} .shape{fill:none;stroke:#7ce3c4;stroke-width:5} .warn{fill:none;stroke:#ff708d;stroke-width:4;stroke-dasharray:10 8}
.pivot{fill:#ffcf5a;stroke:#0b1118;stroke-width:3} .label{fill:#eaf3ff;font:700 30px Arial,sans-serif} .small{fill:#a8bacd;font:22px Arial,sans-serif}
.call{fill:#d9e8f6;font:700 22px Arial,sans-serif} .line{stroke:#d9e8f6;stroke-width:2} .uv{fill:#172536;stroke:#5f7c98;stroke-width:2}
</style><pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#d7dde5"/><rect width="20" height="20" fill="#6f7b88"/><rect x="20" y="20" width="20" height="20" fill="#6f7b88"/></pattern></defs>
<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">CRATE • STEP 3</text><text class="small" x="55" y="95">Support only the shapes that need to stay controlled.</text><path class="mesh" d="M260,220 L780,220 L780,520 L260,520 Z"/><path class="edge" d="M260,220 L380,130 L900,130 L780,220"/><path class="edge" d="M780,220 L900,130 L900,430 L780,520"/><rect x="330" y="285" width="380" height="170" class="edge"/><rect x="278" y="238" width="484" height="264" class="support"/><rect x="296" y="256" width="448" height="228" class="support"/><line class="line" x1="296" y1="256" x2="60" y2="175"/><circle cx="296" cy="256" r="7" fill="#eaf3ff"/><text class="call" x="72" y="182">Support loops near silhouette edges</text><line class="line" x1="330" y1="285" x2="860" y2="230"/><circle cx="330" cy="285" r="7" fill="#eaf3ff"/><text class="call" x="872" y="237">Inset border already controls this recess</text><path class="warn" d="M430,325 L610,325 M430,350 L610,350 M430,395 L610,395 M430,420 L610,420"/><line class="line" x1="610" y1="395" x2="860" y2="455"/><circle cx="610" cy="395" r="7" fill="#eaf3ff"/><text class="call" x="872" y="462">Do NOT fill flat faces with random loops</text><text class="small" x="55" y="665">Flat space is allowed. Add an edge only when it controls silhouette, shading or a real feature.</text></svg>