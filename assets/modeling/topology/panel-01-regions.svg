<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">SCI-FI PANEL • STEP 1</text><text class="small" x="55" y="95">Design three large regions before you touch small detail.</text><rect x="220" y="150" width="720" height="450" class="mesh"/><rect x="275" y="205" width="300" height="340" class="support"/><rect x="615" y="205" width="270" height="145" class="shape"/><rect x="615" y="390" width="270" height="155" class="edge"/><line class="line" x1="275" y1="205" x2="65" y2="175"/><circle cx="275" cy="205" r="7" fill="#eaf3ff"/><text class="call" x="77" y="182">PRIMARY region</text><line class="line" x1="615" y1="205" x2="900" y2="220"/><circle cx="615" cy="205" r="7" fill="#eaf3ff"/><text class="call" x="912" y="227">SECONDARY region</text><text class="small" x="55" y="665">If the panel is not interesting now, twenty tiny bolts will not save it.</text></svg>