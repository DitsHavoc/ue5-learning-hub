<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">BARREL • STEP 4</text><text class="small" x="55" y="95">UV seam: hide one vertical cut, split the caps, keep density consistent.</text><ellipse cx="500" cy="210" rx="170" ry="45" class="mesh"/><path class="mesh" d="M330,210 L330,540 M670,210 L670,540"/><ellipse cx="500" cy="540" rx="170" ry="45" class="edge"/><path class="edge" d="M372.5,180.23529775052336 L372.5,510.23529775052333"/><path class="edge" d="M423.5,169.81371502614357 L423.5,499.81371502614354"/><path class="edge" d="M474.5,165.50913015010832 L474.5,495.5091301501083"/><path class="edge" d="M525.5,165.50913015010832 L525.5,495.5091301501083"/><path class="edge" d="M576.5,169.81371502614357 L576.5,499.81371502614354"/><path class="edge" d="M627.5,180.23529775052336 L627.5,510.23529775052333"/><path class="support" d="M500,165 L500,495"/><line class="line" x1="500" y1="330" x2="770" y2="310"/><circle cx="500" cy="330" r="7" fill="#eaf3ff"/><text class="call" x="782" y="317">One logical vertical seam</text><ellipse cx="500" cy="210" rx="150" ry="35" class="shape"/><ellipse cx="500" cy="540" rx="150" ry="35" class="shape"/><line class="line" x1="640" y1="210" x2="820" y2="185"/><circle cx="640" cy="210" r="7" fill="#eaf3ff"/><text class="call" x="832" y="192">Cap shells split cleanly</text><text class="small" x="55" y="665">Put the seam on the least visible side. The checker should not stretch around the circumference.</text></svg>