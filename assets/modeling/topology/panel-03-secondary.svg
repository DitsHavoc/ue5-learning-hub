<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">SCI-FI PANEL • STEP 3</text><text class="small" x="55" y="95">Secondary recess: shallower so the hierarchy stays readable.</text><rect x="220" y="150" width="720" height="450" class="mesh"/><rect x="285" y="220" width="310" height="315" class="edge"/><rect x="320" y="255" width="240" height="245" class="edge"/><rect x="640" y="230" width="220" height="125" class="support"/><line class="line" x1="640" y1="230" x2="900" y2="240"/><circle cx="640" cy="230" r="7" fill="#eaf3ff"/><text class="call" x="912" y="247">Secondary recess • -1.5 cm</text><path class="warn" d="M640,410 H860 M640,445 H860 M640,480 H860"/><line class="line" x1="860" y1="445" x2="900" y2="465"/><circle cx="860" cy="445" r="7" fill="#eaf3ff"/><text class="call" x="912" y="472">No random greeble fill</text><text class="small" x="55" y="665">The secondary form supports the primary one; it should not fight for attention.</text></svg>