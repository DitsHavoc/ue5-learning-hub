<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">BARREL • STEP 6</text><text class="small" x="55" y="95">Final wireframe check: density should follow the shape, not fear.</text><ellipse cx="500" cy="210" rx="170" ry="45" class="mesh"/><path class="mesh" d="M330,210 L330,540 M670,210 L670,540"/><ellipse cx="500" cy="540" rx="170" ry="45" class="edge"/><path class="edge" d="M372.5,180.23529775052336 L372.5,510.23529775052333"/><path class="edge" d="M423.5,169.81371502614357 L423.5,499.81371502614354"/><path class="edge" d="M474.5,165.50913015010832 L474.5,495.5091301501083"/><path class="edge" d="M525.5,165.50913015010832 L525.5,495.5091301501083"/><path class="edge" d="M576.5,169.81371502614357 L576.5,499.81371502614354"/><path class="edge" d="M627.5,180.23529775052336 L627.5,510.23529775052333"/><ellipse cx="500" cy="255" rx="170" ry="45" class="support"/><ellipse cx="500" cy="300" rx="170" ry="45" class="support"/><ellipse cx="500" cy="445" rx="170" ry="45" class="support"/><ellipse cx="500" cy="495" rx="170" ry="45" class="support"/><path class="warn" d="M310,350 C380,320 620,320 690,350 M310,375 C380,345 620,345 690,375 M310,400 C380,370 620,370 690,400"/><line class="line" x1="690" y1="375" x2="850" y2="350"/><circle cx="690" cy="375" r="7" fill="#eaf3ff"/><text class="call" x="862" y="357">Avoid extra body loops with no job</text><text class="small" x="55" y="665">Curved silhouette needs radial sides; the straight body does not need a cage of horizontal loops.</text></svg>