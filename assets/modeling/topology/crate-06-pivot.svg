<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">CRATE • STEP 6</text><text class="small" x="55" y="95">Place the pivot where a level designer would actually want to grab the asset.</text><path class="mesh" d="M260,220 L780,220 L780,520 L260,520 Z"/><path class="edge" d="M260,220 L380,130 L900,130 L780,220"/><path class="edge" d="M780,220 L900,130 L900,430 L780,520"/><circle class="pivot" cx="260" cy="520" r="15"/><line class="support" x1="260" y1="520" x2="160" y2="620"/><line x1="160" y1="620" x2="205" y2="620" stroke="#ff708d" stroke-width="5"/><line x1="160" y1="620" x2="160" y2="575" stroke="#7ce3c4" stroke-width="5"/><line x1="160" y1="620" x2="120" y2="645" stroke="#4fa8ff" stroke-width="5"/><line class="line" x1="260" y1="520" x2="845" y2="560"/><circle cx="260" cy="520" r="7" fill="#eaf3ff"/><text class="call" x="857" y="567">Useful base / corner pivot</text><text class="small" x="55" y="665">Move the intended pivot point to world 0,0,0 before export. Test beside a 100 cm reference in UE5.</text></svg>