</style><pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#d7dde5"/><rect width="20" height="20" fill="#6f7b88"/><rect x="20" y="20" width="20" height="20" fill="#6f7b88"/></pattern></defs>
<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">BARREL • STEP 2</text><text class="small" x="55" y="95">Profile loops belong where the silhouette or banding changes.</text><ellipse cx="500" cy="210" rx="170" ry="45" class="mesh"/><path class="mesh" d="M330,210 L330,540 M670,210 L670,540"/><ellipse cx="500" cy="540" rx="170" ry="45" class="edge"/><path class="edge" d="M372.5,180.23529775052336 L372.5,510.23529775052333"/><path class="edge" d="M423.5,169.81371502614357 L423.5,499.81371502614354"/><path class="edge" d="M474.5,165.50913015010832 L474.5,495.5091301501083"/><path class="edge" d="M525.5,165.50913015010832 L525.5,495.5091301501083"/><path class="edge" d="M576.5,169.81371502614357 L576.5,499.81371502614354"/><path class="edge" d="M627.5,180.23529775052336 L627.5,510.23529775052333"/><ellipse cx="500" cy="255" rx="170" ry="45" class="support"/><ellipse cx="500" cy="300" rx="170" ry="45" class="support"/><ellipse cx="500" cy="445" rx="170" ry="45" class="support"/><ellipse cx="500" cy="495" rx="170" ry="45" class="support"/><line class="line" x1="665" y1="255" x2="840" y2="205"/><circle cx="665" cy="255" r="7" fill="#eaf3ff"/><text class="call" x="852" y="212">Top rim control</text><line class="line" x1="665" y1="300" x2="840" y2="305"/><circle cx="665" cy="300" r="7" fill="#eaf3ff"/><text class="call" x="852" y="312">Upper band</text><line class="line" x1="665" y1="445" x2="840" y2="440"/><circle cx="665" cy="445" r="7" fill="#eaf3ff"/><text class="call" x="852" y="447">Lower band</text><line class="line" x1="665" y1="495" x2="840" y2="535"/><circle cx="665" cy="495" r="7" fill="#eaf3ff"/><text class="call" x="852" y="542">Base control</text><text class="small" x="55" y="665">No evenly spaced “just because” loops. Put them where the shape actually changes.</text></svg>