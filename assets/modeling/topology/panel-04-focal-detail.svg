<rect class="bg" width="100%" height="100%"/><text class="label" x="55" y="60">SCI-FI PANEL • STEP 4</text><text class="small" x="55" y="95">Add one focal detail with a believable job.</text><rect x="220" y="150" width="720" height="450" class="mesh"/><rect x="285" y="220" width="310" height="315" class="edge"/><rect x="640" y="230" width="220" height="125" class="edge"/><rect x="700" y="410" width="105" height="85" class="shape"/><circle cx="752" cy="452" r="20" fill="none" stroke="#7ce3c4" stroke-width="5"/><line class="line" x1="805" y1="452" x2="900" y2="420"/><circle cx="805" cy="452" r="7" fill="#eaf3ff"/><text class="call" x="912" y="427">Control / access / vent</text><text class="small" x="55" y="665">Ask “what does this do?” before adding it. Function beats noise.</text></svg>