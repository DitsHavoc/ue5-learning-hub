<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="1100" height="650" rx="28" fill="#0b1017"/><text x="60" y="62" font-family="Arial" font-size="28" font-weight="700" fill="#eef4fb">Modifier stack = history you can still edit</text><text x="60" y="95" font-family="Arial" font-size="16" fill="#91a6bb">CONCEPT MAP — 3ds Max evaluates from the bottom upward.</text><g font-family="Arial"><rect x="360" y="470" width="380" height="70" rx="16" fill="#182331" stroke="#64d2ff"/><text x="395" y="513" font-size="22" fill="#dcecff">Box — base dimensions</text><rect x="360" y="365" width="380" height="70" rx="16" fill="#182331" stroke="#b66cff"/><text x="395" y="408" font-size="22" fill="#ead9ff">Edit Poly — shape changes</text><rect x="360" y="260" width="380" height="70" rx="16" fill="#182331" stroke="#65e0a5"/><text x="395" y="303" font-size="22" fill="#d8ffea">Symmetry — mirror half</text><rect x="360" y="155" width="380" height="70" rx="16" fill="#182331" stroke="#ffbd63"/><text x="395" y="198" font-size="22" fill="#fff0cf">Chamfer — edge finish</text><path d="M550 450v-32 M550 345v-32 M550 240v-32" stroke="#7f95aa" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#7f95aa"/></marker></defs><text x="65" y="580" font-size="18" fill="#ff9fb0">Do not collapse the stack just because “it looks finished”. Collapse only when you understand what editability you are giving up.</text></g></svg>
