<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" rx="28" fill="#0b1017"/><text x="60" y="62" font-family="Arial" font-size="28" font-weight="700" fill="#eef4fb">Editable Poly: know what you are selecting</text><text x="60" y="95" font-family="Arial" font-size="16" fill="#91a6bb">CONCEPT MAP — the five sub-object levels are different tools for different jobs.</text>
<g font-family="Arial"><rect x="70" y="150" width="190" height="150" rx="18" fill="#162131" stroke="#63d4ff"/><text x="95" y="195" font-size="24" font-weight="700" fill="#63d4ff">Vertex</text><text x="95" y="230" font-size="16" fill="#c8d7e6">A point.</text><text x="95" y="260" font-size="15" fill="#9cafc3">Move / weld points.</text>
<rect x="285" y="150" width="190" height="150" rx="18" fill="#162131" stroke="#63d4ff"/><text x="310" y="195" font-size="24" font-weight="700" fill="#63d4ff">Edge</text><text x="310" y="230" font-size="16" fill="#c8d7e6">A line between verts.</text><text x="310" y="260" font-size="15" fill="#9cafc3">Loops / chamfers.</text>
<rect x="500" y="150" width="190" height="150" rx="18" fill="#162131" stroke="#63d4ff"/><text x="525" y="195" font-size="24" font-weight="700" fill="#63d4ff">Border</text><text x="525" y="230" font-size="16" fill="#c8d7e6">Open edge boundary.</text><text x="525" y="260" font-size="15" fill="#9cafc3">Cap / bridge holes.</text>
<rect x="715" y="150" width="190" height="150" rx="18" fill="#162131" stroke="#ff77c8"/><text x="740" y="195" font-size="24" font-weight="700" fill="#ff77c8">Polygon</text><text x="740" y="230" font-size="16" fill="#c8d7e6">A face.</text><text x="740" y="260" font-size="15" fill="#9cafc3">Inset / extrude.</text>
<rect x="930" y="150" width="190" height="150" rx="18" fill="#162131" stroke="#ffb85c"/><text x="955" y="195" font-size="24" font-weight="700" fill="#ffb85c">Element</text><text x="955" y="230" font-size="16" fill="#c8d7e6">Connected chunk.</text><text x="955" y="260" font-size="15" fill="#9cafc3">Move whole parts.</text>
<rect x="70" y="350" width="1050" height="210" rx="20" fill="#131b26" stroke="#3f5268"/><text x="95" y="395" font-size="22" font-weight="700" fill="#e8f0f8">Safety check before every edit</text><text x="95" y="435" font-size="18" fill="#c5d3e1">1. Look at the active sub-object level.</text><text x="95" y="470" font-size="18" fill="#c5d3e1">2. Confirm only the intended parts are selected.</text><text x="95" y="505" font-size="18" fill="#c5d3e1">3. Orbit the model once before committing a destructive operation.</text><text x="95" y="540" font-size="18" fill="#ff9fb0">If the wrong parts move: Undo immediately. Do not “fix the fix”.</text></g></svg>
