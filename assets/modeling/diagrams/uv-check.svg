<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#0b1017"/><text x="60" y="62" font-family="Arial" font-size="28" font-weight="700" fill="#eef4fb">UV check: use the checker before the texture</text><text x="60" y="95" font-family="Arial" font-size="16" fill="#91a6bb">CONCEPT DIAGRAM — squares make stretching and inconsistent scale obvious.</text><defs><pattern id="chk" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#d7dce2"/><rect width="20" height="20" fill="#647180"/><rect x="20" y="20" width="20" height="20" fill="#647180"/></pattern></defs><g font-family="Arial"><rect x="90" y="160" width="430" height="300" rx="18" fill="url(#chk)" stroke="#66e0a5" stroke-width="4"/><text x="90" y="510" font-size="20" fill="#66e0a5">GOOD: squares are square and roughly similar size.</text><g transform="translate(660 160) skewX(-18)"><rect width="430" height="300" rx="18" fill="url(#chk)" stroke="#ff7286" stroke-width="4"/></g><text x="660" y="510" font-size="20" fill="#ff7286">FIX: stretched checker = stretched texture.</text><text x="90" y="560" font-size="18" fill="#dbe6ef">Also check overlaps, wasted space and texel density before exporting.</text></g></svg>
