<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="28" fill="#0b1017"/><text x="60" y="62" font-family="Arial" font-size="28" font-weight="700" fill="#eef4fb">Topology check: clean enough for the job</text><text x="60" y="95" font-family="Arial" font-size="16" fill="#91a6bb">CONCEPT DIAGRAM — judge edge flow and density, not “quad purity” for its own sake.</text><g font-family="Arial"><rect x="70" y="145" width="490" height="380" rx="22" fill="#131e29" stroke="#63e49f"/><text x="95" y="190" font-size="24" font-weight="700" fill="#63e49f">GOOD</text><path d="M130 250 H500 M130 310 H500 M130 370 H500 M130 430 H500 M205 220 V470 M280 220 V470 M355 220 V470 M430 220 V470" stroke="#7da1bd" stroke-width="2"/><text x="95" y="500" font-size="17" fill="#bfd0de">Even density • edges support the shape • no accidental clutter</text><rect x="640" y="145" width="490" height="380" rx="22" fill="#131e29" stroke="#ff7286"/><text x="665" y="190" font-size="24" font-weight="700" fill="#ff7286">CHECK / FIX</text><path d="M700 230 L1020 475 M710 465 L1040 250 M680 320 L1090 330 M850 210 L830 500 M930 210 L980 500 M760 210 L720 500" stroke="#b25c68" stroke-width="2"/><circle cx="890" cy="350" r="55" fill="none" stroke="#ff7286" stroke-width="4"/><text x="665" y="500" font-size="17" fill="#e4b8bf">Random cuts • tiny faces • edge density with no purpose • cleanup needed</text><text x="70" y="585" font-size="18" fill="#dbe6ef">Rule: add geometry because the silhouette, deformation, shading or material needs it — not because the button lets you.</text></g></svg>
