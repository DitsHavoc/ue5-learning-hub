<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="470" viewBox="0 0 1250 470"><rect width="1250" height="470" rx="28" fill="#0b1017"/><text x="60" y="62" font-family="Arial" font-size="28" font-weight="700" fill="#eef4fb">Game asset pipeline</text><text x="60" y="95" font-family="Arial" font-size="16" fill="#91a6bb">Each stage must pass its own check before the asset moves on.</text><g font-family="Arial" font-size="18" font-weight="700" text-anchor="middle"><rect x="55" y="170" width="180" height="100" rx="20" fill="#172230" stroke="#64d3ff"/><text x="145" y="215" fill="#e6f5ff">3ds Max</text><text x="145" y="245" font-size="14" fill="#98b5ca">model cleanly</text><rect x="285" y="170" width="180" height="100" rx="20" fill="#172230" stroke="#b96fff"/><text x="375" y="215" fill="#f1e5ff">UVs</text><text x="375" y="245" font-size="14" fill="#bca7cf">checker passes</text><rect x="515" y="170" width="180" height="100" rx="20" fill="#172230" stroke="#ffb95e"/><text x="605" y="215" fill="#fff1d6">Substance</text><text x="605" y="245" font-size="14" fill="#cdbb9a">texture deliberately</text><rect x="745" y="170" width="180" height="100" rx="20" fill="#172230" stroke="#67e1a4"/><text x="835" y="215" fill="#e0ffef">FBX Export</text><text x="835" y="245" font-size="14" fill="#9ecab5">scale + pivot</text><rect x="975" y="170" width="180" height="100" rx="20" fill="#172230" stroke="#ff71c6"/><text x="1065" y="215" fill="#ffe4f6">UE5</text><text x="1065" y="245" font-size="14" fill="#d0a7c2">verify in engine</text><path d="M235 220H275 M465 220H505 M695 220H735 M925 220H965" stroke="#72889e" stroke-width="5"/><text x="625" y="355" font-size="20" fill="#ff9fb0">If a stage fails, go back one stage. Do not hide a modelling problem with a texture or material.</text></g></svg>
