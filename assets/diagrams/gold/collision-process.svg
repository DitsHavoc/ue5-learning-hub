<text x="517.8" y="258" fill="#d8e3ee" font-size="15" font-weight="700" text-anchor="start">Configure object/channel</text>
<text x="517.8" y="279" fill="#d8e3ee" font-size="15" font-weight="700" text-anchor="start">responses deliberately.</text>
<path d="M922.6 280.0 L939.6 280.0" stroke="#536a82" stroke-width="4" fill="none" marker-end="url(#a)"/>
<rect x="722.2" y="175" width="200.4" height="210" rx="15" fill="#111c28" stroke="#2c4258" stroke-width="2"/>
<circle cx="756.2" cy="210" r="18" fill="#18314a" stroke="#3b6385"/>
<text x="756.2" y="216" fill="#7dc2fb" font-size="15" font-weight="700" text-anchor="middle">4</text>
<text x="740.2" y="258" fill="#d8e3ee" font-size="15" font-weight="700" text-anchor="start">Enable the required</text>
<text x="740.2" y="279" fill="#d8e3ee" font-size="15" font-weight="700" text-anchor="start">events.</text>
<rect x="944.6" y="175" width="200.4" height="210" rx="15" fill="#111c28" stroke="#2c4258" stroke-width="2"/>
<circle cx="978.6" cy="210" r="18" fill="#18314a" stroke="#3b6385"/>
<text x="978.6" y="216" fill="#7dc2fb" font-size="15" font-weight="700" text-anchor="middle">5</text>
<text x="962.6" y="258" fill="#d8e3ee" font-size="15" font-weight="700" text-anchor="start">Debug the collision</text>
<text x="962.6" y="279" fill="#d8e3ee" font-size="15" font-weight="700" text-anchor="start">first, then build</text>
<text x="962.6" y="300" fill="#d8e3ee" font-size="15" font-weight="700" text-anchor="start">gameplay consequences.</text>
